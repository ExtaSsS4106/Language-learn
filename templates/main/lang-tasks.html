  <style>
    

body {

width: 100%;
height: 90%;

.-usrnm {

  grid-template-rows: 20% 90%;
  /* Frame 1 */

box-sizing: border-box;
border-radius: 4px;

.lang-list {

.not_started{
    color: black;
}
button {

  height: 50px;

  box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
  border: none;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;

img {

  border-radius: 10px;

  {% csrf_token %}
</head>
<body>
  <header>

  <div class="_left_side">
    <button class="previous"></button>
    <dir class="selected-lang">

      
      <img class="lang-head" src="https://languagetraining.com/wp-content/uploads/2015/11/flag-english.jpg"/>
      <h3>English</h3>
      

    </dir>

  </div>
  <div class="_right_side">
    <div class="-L-left"></div>
    <div class="-L-right">
      <div class="-usrnm">
        <div class="User_name">ExtaSsS</div>
        
      </div>
      <div class="avatar"></div>
    </div>
  </div>

</header>
<section>

  <div class="label"><h3>Список языков пользователя</h3></div>

  <div class="lang-list">

    <div class="course">
      <div class="tasks">
        <div class="t-panel">
            {% for task in tasks_with_progress %}
                <button 
                
                taskId = "{{task.task_id}}"
                
                class="btn-task {{task.status}}">{{task.task}}</button>
            {% endfor %}
        </div>
      </div>

      <div class="screen">
        <div class="screen-back">
          <div class="screen-main">
              <div class="screen-content">
                
                </div>
              </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</section>


  <script>



    function getCsrfToken() {
      const name = 'csrftoken';
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    // CSRF токен для Django

        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.btn-task');
            const screenContent = document.querySelector('.screen-content');
            const csrfToken = getCsrfToken();
            buttons.forEach(button => {
                button.addEventListener('click', async function() {
                    const taskId = this.getAttribute('data-id');
                    
                    try {
                        // Показываем загрузку
                        screenContent.innerHTML = '<p>Загрузка...</p>';
                        
                        const response = await fetch('/api', { // Ваш URL
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': csrfToken
                            },
                            body: JSON.stringify({ task_id: this.getAttribute('taskId') })
                        });
                        const result = await response.text();
                        document.querySelector(".screen-content").innerHTML = result; 

                    } catch (error) {
                        console.error("[Error]", error);
                    }

                });
            });
        });

  </script>
</body>
